services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: pulse-live-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "${MINIO_S3_PORT}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT}:9001" # MinIO Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: pulse-live-app
    environment:
      MODEL_CHECKPOINT_PATH: ${MODEL_CHECKPOINT_PATH}
      MODEL_NORM_PATH: ${MODEL_NORM_PATH}
      MODEL_COMBINATION_ID: ${MODEL_COMBINATION_ID}
      WINDOW_SECONDS: ${WINDOW_SECONDS}
      MIN_FRAMES: ${MIN_FRAMES}
      TARGET_FPS: ${TARGET_FPS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_SECURE: ${MINIO_SECURE}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET}
    ports:
      - "8000:8000"
    depends_on:
      minio:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  minio_data:
    driver: local
